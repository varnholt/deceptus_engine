[project]
name = "pixelart"
version = "0.1.0"
description = "Blender scenes to pixel art in a target artist's style, with a tuning GUI and an MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelart"]
